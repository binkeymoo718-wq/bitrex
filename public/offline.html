<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07111f" />
  <title>BITREX Offline</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(180deg,#07111f,#0a1525);font-family:Inter,system-ui,Arial,sans-serif;color:#eef6ff}
    .card{max-width:460px;padding:24px;border-radius:8px;background:rgba(14,27,45,.84);border:1px solid rgba(95,133,171,.32);box-shadow:0 20px 60px rgba(0,0,0,.34)}
    .mark{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,#2f7cf6,#26c6da);font-weight:900}
    p{color:#9db3c9;line-height:1.55}a{color:#8fe6ef;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">B</div>
    <h1>You are offline</h1>
    <p>BITREX cached the core app shell. Reconnect to refresh balances, submit deposits, request withdrawals, or sync new transactions.</p>
    <a href="/">Open cached dashboard</a>
  </main>
</body>
</html>
